<svg xmlns="http://www.w3.org/2000/svg" width="195" height="48" viewBox="0 0 195 48" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16162A"/>
      <stop offset="100%" stop-color="#0F0F1B"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="nocturneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>

  <!-- Button Base -->
  <rect width="195" height="48" rx="10" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Icon Container & Nocturne Brand Emblem -->
  <rect x="12" y="10" width="28" height="28" rx="7" fill="#6366F1" fill-opacity="0.18"/>
  <g transform="translate(26, 24) scale(0.44) translate(-50, -50)">
    <path d="M32,62 L32,44 A12,12 0 0 1 56,44 L56,50 M68,38 L68,56 A12,12 0 0 1 44,56 L44,50" 
          stroke="url(#nocturneGrad)" 
          stroke-width="7.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
  </g>

  <!-- Typography -->
  <text x="48" y="18" fill="#A5B4FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="0.6">OFFICIAL WEBSITE</text>
  <text x="48" y="34" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700">Nocturne Music</text>
</svg>
